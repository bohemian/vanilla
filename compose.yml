# Docker Compose for lightweight local development.
# Usage:
#   make deploy               → builds image locally, starts postgres + app
#   make deploy VERSION=<tag> → pulls ghcr.io/bohemian/vanilla:<tag> from GHCR
#
# Postgres is accessible at localhost:5432 for DB UIs (no port-forward needed).
# App is accessible at http://localhost:8080.
# JDWP remote debugger is accessible at localhost:5005.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vanilla
      POSTGRES_PASSWORD: vanilla
      POSTGRES_DB: vanilla
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanilla"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # VANILLA_IMAGE is set by the Makefile deploy target.
    # For VERSION=local it becomes vanilla:local (built by `docker build`).
    # For VERSION=<tag> it becomes ghcr.io/bohemian/vanilla:<tag>.
    image: ${VANILLA_IMAGE:-vanilla:local}
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vanilla
      SPRING_DATASOURCE_USERNAME: vanilla
      SPRING_DATASOURCE_PASSWORD: vanilla
      # Text logging for local dev (JSON/ECS is used in k8s where log aggregators parse it).
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12  # up to 1 minute of retries after start_period
      start_period: 90s
