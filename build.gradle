plugins {
    id 'java'
    id 'groovy'
    id 'jacoco'
    id 'pmd'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.3'
    id 'com.github.spotbugs' version '6.1.11'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'org.owasp.dependencycheck' version '12.1.3'
    // Spring Cloud Contract — verify this version is compatible with Spring Boot 4.x;
    // update to 5.x.x when the Spring Cloud 2025.0.x release train is available.
    id 'org.springframework.cloud.contract' version "$springCloudContractVersion"
    // Generates openapi.json at build time by booting the app against H2 in-memory DB.
    // Output: build/docs/openapi/openapi.json — published as a CI artifact for clients.
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
    // Generates a typed Java client from openapi.json; published as vanilla-client to GitHub Packages.
    id 'org.openapi.generator' version '7.10.0'
}

spotless {
    java {
        googleJavaFormat()
        targetExclude('build/**')
    }
}

spotbugs {
    toolVersion = '4.9.3'
    ignoreFailures = true  // findings are advisory; they don't break the build
    effort = 'max'
    reportLevel = 'low'
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsMain {
    jvmArgs = ['-Xmx256m', '-XX:MaxMetaspaceSize=128m']
    reports {
        xml { required = true }
        html { required = false }
    }
}

spotbugsTest { enabled = false }

pmd {
    toolVersion = '7.7.0'
    consoleOutput = false
    ignoreFailures = true  // findings are advisory
    ruleSetFiles = files('config/pmd-rules.xml')
    ruleSets = []  // suppress default rulesets; use only config/pmd-rules.xml
}

pmdMain {
    maxHeapSize = '128m'
    reports {
        xml { required = true }
        html { required = false }
    }
}

pmdTest { enabled = false }

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

// Wire coverage gate into the standard check lifecycle
check.dependsOn jacocoTestCoverageVerification
jacocoTestCoverageVerification.dependsOn jacocoTestReport

pitest {
    targetClasses = ['vanilla.*']
    targetTests = ['vanilla.*Spec', 'vanilla.*Test']
    mutators = ['STRONGER']
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 70  // fail if < 70% of mutations are killed
    junit5PluginVersion = '1.2.1'
    // Run with: ./gradlew pitest  (slow — not wired into check)
}

dependencyCheck {
    failBuildOnCVSS = 7  // fail on high/critical CVEs only
    suppressionFile = 'config/owasp-suppressions.xml'
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }
    analyzers {
        nuspecEnabled = false
        nugetconfEnabled = false
        nodeEnabled = false
        nodeAuditEnabled = false
        retirejs { enabled = false }
    }
}

group = 'com.vanilla'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // Spring Cloud BOM — aligns all spring-cloud-* versions with each other.
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

contracts {
    testFramework = org.springframework.cloud.contract.verifier.config.TestFramework.JUNIT5
    // WEBTESTCLIENT mode: generated tests use Spring's WebTestClient backed by MockMvcWebTestClient.
    // This avoids two Spring Boot 4 / Spring Cloud Contract 4.x incompatibilities:
    //   1. MOCKMVC mode: MockHttpServletRequestBuilder.header(String, Object[]) removed in Spring 7
    //   2. EXPLICIT mode: RestAssured 5.2.1 Groovy internals conflict with the project's Groovy 5.x
    // Update to Spring Cloud Contract 5.x when the Spring Cloud 2025.0.x train ships for Boot 4.
    testMode = org.springframework.cloud.contract.verifier.config.TestMode.WEBTESTCLIENT
    baseClassForTests = 'vanilla.contracts.ContractVerifierBase'
}

openApi {
    apiDocsUrl = "http://localhost:8080/v3/api-docs"
    outputFileName = "openapi.json"
    outputDir = file("${layout.buildDirectory.get()}/docs/openapi")
    // Boot the app against H2 in-memory DB so no Postgres is needed during doc generation.
    customBootRun {
        args = [
            "--spring.datasource.url=jdbc:h2:mem:openapi;DB_CLOSE_DELAY=-1",
            "--spring.datasource.driver-class-name=org.h2.Driver",
            "--spring.datasource.username=sa",
            "--spring.datasource.password=",
            "--spring.flyway.enabled=false",
            "--spring.jpa.database-platform=org.hibernate.dialect.H2Dialect",
            "--spring.jpa.hibernate.ddl-auto=create-drop"
        ]
    }
}

// Source set for the generated client. Only the Java source directory is wired in;
// the rest of openApiGenerate's output (build scripts, .gitignore, etc.) is ignored.
// Source set for JBehave black-box BDD tests that run against a live app.
sourceSets {
    client {
        java.srcDirs = ["${layout.buildDirectory.get()}/generated/openapi-client/src/main/java"]
    }
    bdd {
        java.srcDirs = ['src/bdd/java']
        resources.srcDirs = ['src/bdd/resources']
    }
}

// Give the client source set access to the same runtime dependencies as main
// (spring-web, jackson-databind, etc. all come in via spring-boot-starter-web).
configurations {
    clientImplementation.extendsFrom implementation
    bddImplementation
    bddRuntimeOnly
}

openApiGenerate {
    generatorName = "java"
    // "native" uses java.net.http.HttpClient (Java 11+) and Jackson — no Spring Framework
    // dependency. This avoids breakage from Spring Framework 7 API removals in the
    // resttemplate generator templates (fromHttpUrl, HttpHeaders.entrySet, etc.).
    // Consumers of vanilla-client only need jackson-databind on their classpath.
    library = "native"
    inputSpec = "${layout.buildDirectory.get()}/docs/openapi/openapi.json"
    outputDir = "${layout.buildDirectory.get()}/generated/openapi-client"
    apiPackage = "vanilla.client.api"
    modelPackage = "vanilla.client.model"
    invokerPackage = "vanilla.client"
    // Suppress tests, docs, and the sample build scripts — we only want the source.
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
        dateLibrary            : "java8",
        hideGenerationTimestamp: "true",
        openApiNullable        : "false"
    ]
}

// openApiGenerate reads the spec that generateOpenApiDocs produces, so declare
// the dependency explicitly to satisfy Gradle's task validation.
// Both locally and in CI the full chain is: generateOpenApiDocs → openApiGenerate → compileClientJava → clientJar
tasks.named('openApiGenerate').configure { dependsOn 'generateOpenApiDocs' }
compileClientJava.dependsOn 'openApiGenerate'

jar {
    manifest {
        attributes "Main-Class": "vanilla.Application"
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    enabled = false
}

dependencies {
    // JBehave BDD tests — black-box, run against a live app outside the check lifecycle.
    // JBehave 5.0 is JUnit 5-native (JupiterStories); no JUnit 4 / vintage engine needed.
    bddImplementation "org.jbehave:jbehave-core:$jbehaveVersion"
    bddImplementation "org.junit.jupiter:junit-jupiter-api"
    bddImplementation "com.fasterxml.jackson.core:jackson-databind"
    bddRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    bddRuntimeOnly "org.junit.platform:junit-platform-launcher"

    implementation "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    implementation "org.springframework.boot:spring-boot-starter-web:$springVersion"
    implementation "org.springframework.boot:spring-boot-starter-validation:$springVersion"
    implementation "org.springframework.boot:spring-boot-starter-actuator:$springVersion"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:$springVersion"
    implementation "org.springframework.boot:spring-boot-starter-jdbc:$springVersion"
    implementation "org.springframework.boot:spring-boot-autoconfigure:$springVersion"
    implementation "org.postgresql:postgresql:$postgresqlDriverVersion"
    implementation "org.flywaydb:flyway-core:11.20.0"
    implementation "org.flywaydb:flyway-database-postgresql:11.20.0"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9"

    testImplementation platform("org.spockframework:spock-bom:$spockVersion")
    testImplementation "org.spockframework:spock-core:$spockVersion"
    testImplementation "org.spockframework:spock-spring:$spockVersion"
    testImplementation "org.apache.groovy:groovy-all:$groovyVersion"
    testImplementation("org.springframework.boot:spring-boot-starter-test:$springVersion") {
//        exclude group: 'org.mockito', module: 'mockito-core'
    }
    testImplementation "org.springframework.boot:spring-boot-testcontainers:$springVersion"
//    testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.3"
    testImplementation "org.testcontainers:testcontainers:2.0.3"
    testImplementation "org.testcontainers:postgresql:1.21.4"
    testImplementation "org.testcontainers:spock:1.20.1"
    testImplementation "org.testcontainers:jdbc:1.21.4"
    testImplementation "com.tngtech.archunit:archunit:1.3.0"
//    testImplementation(libs.mockito)
//    mockitoAgent(libs.mockito) {
//        transitive = false
//    }
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testImplementation "io.rest-assured:spring-web-test-client:$restAssuredVersion"
    // WebTestClient (used by spring-web-test-client) requires the reactive-streams API
    // which ships with spring-webflux. This does not activate WebFlux at runtime since
    // Spring Boot auto-detects the MVC stack when both are on the classpath.
    testImplementation "org.springframework.boot:spring-boot-starter-webflux:$springVersion"

    // H2 is only needed to boot the app during OpenAPI doc generation (generateOpenApiDocs task).
    // It is never on the test classpath and never used at runtime in production.
    runtimeOnly 'com.h2database:h2'

    // Compile-only annotations required by the openapi-generator output.
    // Not needed at runtime — annotation metadata only.
    // jsr305 provides @Nonnull / @Nullable (javax.annotation from JSR-305).
    // javax.annotation-api provides @Generated (javax.annotation from JSR-250, removed from JDK 11+).
    clientCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    clientCompileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "net.bytebuddy:byte-buddy:$bytebuddyVersion"
    testRuntimeOnly "org.objenesis:objenesis:$objenesisVersion"

    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

test {
    jvmArgs '-Xshare:off',
            '-Xmx256m',
            '-XX:MaxMetaspaceSize=384m'
    useJUnitPlatform()
    // Exclude the backward-compat spec: it uses its own fresh container and must be run
    // via the migrationCompatTest task with a -PflywayTarget so the target version is set.
    exclude '**/MigrationBackwardCompatSpec.*'
    finalizedBy jacocoTestReport // Report is always generated after tests run
    testLogging {
        events "skipped", "failed" // but not "passed"
        showStandardStreams = true
    }
}

tasks.register('migrationCompatTest', Test) {
    description = 'Verifies the app starts and handles requests against the old DB schema ' +
                  '(without migrations added in this PR). Run with -PflywayTarget=<N>.'
    group = 'verification'

    // spring.flyway.target is read by Spring Boot Flyway auto-config from the Spring Environment,
    // which includes JVM system properties. Setting it here caps Flyway at version N so the app
    // starts against the old schema, exposing any code that requires the new migration to exist.
    if (project.hasProperty('flywayTarget')) {
        systemProperty 'spring.flyway.target', project.flywayTarget
    }

    filter {
        includeTestsMatching '*MigrationBackwardCompatSpec'
    }

    jvmArgs '-Xshare:off',
            '-Xmx256m',
            '-XX:MaxMetaspaceSize=384m'
    useJUnitPlatform()
    testLogging {
        events "skipped", "failed"
        showStandardStreams = true
    }
}

// Black-box BDD tests using JBehave. Requires a running app (make deploy).
// Not wired into check — run explicitly with: ./gradlew bddTest [-PbddBaseUrl=http://...].
tasks.register('bddTest', Test) {
    description = 'JBehave BDD tests against a running app. Start it first with: make deploy'
    group = 'verification'
    testClassesDirs = sourceSets.bdd.output.classesDirs
    classpath = sourceSets.bdd.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'bddBaseUrl', project.findProperty('bddBaseUrl') ?: 'http://localhost:8080'
    jvmArgs '-Xmx256m', '-XX:MaxMetaspaceSize=256m'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// Post-deploy verification — non-invasive read-only BDD stories run by k8s-verify.sh
// inside a Kubernetes Job against a candidate pod before it receives production traffic.
// Not wired into check; run explicitly: ./gradlew verifyTest [-PbddBaseUrl=http://...].
tasks.register('verifyTest', Test) {
    description = 'Non-invasive JBehave verification stories for the k8s post-deploy readiness gate.'
    group = 'verification'
    testClassesDirs = sourceSets.bdd.output.classesDirs
    classpath = sourceSets.bdd.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'bddBaseUrl', project.findProperty('bddBaseUrl') ?: 'http://localhost:8080'
    jvmArgs '-Xmx256m', '-XX:MaxMetaspaceSize=256m'
    // Run only VerificationStories — ProductCrudStories is invasive (creates/deletes products)
    // and must not run against a pod being verified for production traffic.
    filter {
        includeTestsMatching 'vanilla.bdd.VerificationStories'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

tasks.register('clientJar', Jar) {
    group = 'build'
    description = 'Packages the generated vanilla-client JAR for publishing to GitHub Packages.'
    archiveBaseName = 'vanilla-client'
    archiveClassifier = ''
    from sourceSets.client.output
    dependsOn compileClientJava
}

publishing {
    publications {
        boot(MavenPublication) {
            artifact(tasks.bootJar)
        }
        // Typed REST client generated from the service's own OpenAPI spec.
        // Consumers: implementation 'com.vanilla:vanilla-client:<version>'
        // Requires spring-boot-starter-web on the consumer's classpath (RestTemplate + Jackson).
        // Typed REST client generated from the service's own OpenAPI spec.
        // Uses java.net.http.HttpClient (Java 11+) — no Spring Framework dependency.
        // Consumer dependency: implementation 'com.vanilla:vanilla-client:<version>'
        client(MavenPublication) {
            groupId = 'com.vanilla'
            artifactId = 'vanilla-client'
            version = project.version
            artifact(tasks.clientJar)
            pom {
                name = 'vanilla-client'
                description = 'Generated Java client for the vanilla service (java.net.http + Jackson)'
                withXml {
                    def depsNode = asNode().appendNode('dependencies')
                    // jackson-databind and jackson-datatype-jsr310 are the only runtime deps.
                    // Spring Boot consumers have these managed by the Boot BOM already.
                    [
                        ['com.fasterxml.jackson.core',     'jackson-databind'],
                        ['com.fasterxml.jackson.datatype', 'jackson-datatype-jsr310'],
                    ].each { grp, art ->
                        def managedVersion = dependencyManagement.managedVersions["${grp}:${art}"]
                        def dep = depsNode.appendNode('dependency')
                        dep.appendNode('groupId', grp)
                        dep.appendNode('artifactId', art)
                        if (managedVersion) dep.appendNode('version', managedVersion)
                        dep.appendNode('scope', 'compile')
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/bohemian/vanilla")
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: ''
                password = System.getenv('GITHUB_TOKEN') ?: ''
            }
        }
    }
}
