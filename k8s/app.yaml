# VANILLA_IMAGE is replaced at deploy time by the Makefile deploy target.
# For VERSION=local it becomes vanilla:local (imported into k3d via k3d image import).
# For VERSION=<tag> it becomes ghcr.io/bohemian/vanilla:<tag> (pulled from GHCR).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanilla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanilla
  template:
    metadata:
      labels:
        app: vanilla
    spec:
      containers:
        - name: vanilla
          image: VANILLA_IMAGE
          # IfNotPresent works for both cases: k3d image import loads the image into
          # containerd so it is already "present"; GHCR images are pulled on first use.
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/vanilla
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            # Enables JDWP remote debugging on port 5005. suspend=n lets the server
            # start immediately without waiting for a debugger to attach.
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
            # Emit JSON logs (ECS format) in k8s so log aggregators can parse them.
            # Text logging is used locally (compose.yml) where JSON is hard to read.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
          ports:
            - containerPort: 8080
            - containerPort: 5005
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          # startupProbe allows up to 60s for Spring Boot to initialise before liveness kicks in.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vanilla
spec:
  selector:
    app: vanilla
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: debug
      port: 5005
      targetPort: 5005
