apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
stringData:
  username: vanilla
  password: vanilla
  database: vanilla
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database
          ports:
            - containerPort: 5432
          resources:
            limits:
              memory: 256Mi
---
# NodePort 30432 is mapped to host port 5432 at cluster creation time (see Makefile deploy target),
# so DB UIs can connect directly to localhost:5432 without any port-forward command.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
