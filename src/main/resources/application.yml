logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG

management:
  endpoint:
    health:
      probes:
        enabled: true  # exposes /actuator/health/liveness and /actuator/health/readiness
      show-details: always   # include per-indicator details in /actuator/health response
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info  # expose /actuator/health and /actuator/info over HTTP
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

spring:
  datasource:
    driverClassName: org.postgresql.Driver
  flyway:
    enabled: true
    locations: "classpath:db/migration"
    baselineOnMigrate: true
  jpa:
    databasePlatform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddlAuto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
      temp:
        use_jdbc_metadata_defaults: false
