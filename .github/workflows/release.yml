name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Release
  packages: write   # publish to GitHub Packages + GHCR
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21 (for Spotless)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Apply formatting
        run: ./gradlew spotlessApply

      - name: Set up Java 25 (for build and test)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Test
        run: ./gradlew test

      - name: Build service JAR
        run: ./gradlew assemble

      - name: Generate OpenAPI spec and client JAR
        run: ./gradlew clientJar

      - name: Publish service JAR to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish client JAR to GitHub Packages
        run: ./gradlew publishClientPublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/bohemian/vanilla:${{ steps.meta.outputs.version }}
            ghcr.io/bohemian/vanilla:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/bohemian/vanilla:latest
          format: json
          output: trivy-results.json
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Warn on vulnerabilities
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::Trivy found $COUNT CRITICAL/HIGH CVE(s) — review trivy-results.json"
          else
            echo "Container scan clean."
          fi

      - name: Push Docker image
        run: |
          docker push ghcr.io/bohemian/vanilla:${{ steps.meta.outputs.version }}
          docker push ghcr.io/bohemian/vanilla:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "build/docs/openapi/openapi.json#openapi.json"
