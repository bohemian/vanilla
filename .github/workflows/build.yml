name: Java Build Pipeline

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 3am UTC — triggers dependency-audit

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'  # schedule only triggers dependency-audit

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # head_ref is set on pull_request events (branch name); ref_name on push events.
          # Without this, a push-triggered run checks out a detached HEAD and can't push
          # the Spotless formatting commit back to the branch.
          ref: ${{ github.head_ref || github.ref_name }}

      # Spotless (google-java-format) requires Java 21+. We run it first on 21,
      # then switch to 25 for the actual build and tests.
      - name: Set up Java 21 (for Spotless)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Apply formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase before committing to avoid conflicts if the branch moved
          # between the checkout and this step (e.g. concurrent pushes).
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          ./gradlew spotlessApply
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: apply Spotless formatting"
            git push
          fi

      - name: Set up Java 25 (for build and test)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Test
        run: ./gradlew test

      - name: Static analysis (SpotBugs + PMD)
        run: ./gradlew spotbugsMain pmdMain

      - name: Coverage gate
        run: ./gradlew jacocoTestCoverageVerification

      - name: Build
        run: ./gradlew assemble

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 14

      - name: Upload analysis reports
        if: always()  # upload even when tests or analysis steps fail, so reports are inspectable
        uses: actions/upload-artifact@v5
        with:
          name: analysis-reports
          path: |
            build/reports/spotbugs/
            build/reports/pmd/
            build/reports/jacoco/
          retention-days: 14

  pr-review:
    runs-on: ubuntu-latest
    # Exclude github-actions[bot] to prevent an infinite loop: the bot's own Spotless
    # formatting commit would otherwise re-trigger another review.
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
      - name: Load review prompt
        id: prompt
        run: |
          PROMPT=$(awk 'BEGIN{n=0} /^---/{n++; next} n>=2{print}' .claude/agents/pr-review/pr-review.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Read,Grep,Glob,Edit,Write,Bash(git:*)"'
          prompt: ${{ steps.prompt.outputs.content }}

  dependency-audit:
    runs-on: ubuntu-latest
    # Run on the weekly schedule, or on any PR labelled "dependencies" for on-demand audits.
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(toJson(github.event.pull_request.labels.*.name), 'dependencies'))
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: OWASP dependency vulnerability scan
        run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: owasp-report
          path: build/reports/dependency-check-report.html
          retention-days: 30

  # Determines whether the push to main was a PR merge (2-parent merge commit)
  # or a direct push (1-parent commit). Only PR merges should trigger publish.
  gate-publish:
    runs-on: ubuntu-latest
    # Must be scoped to push-to-main: on pull_request events GitHub creates a temporary
    # 2-parent merge ref, which would fool the parent-count check and trigger publish
    # on every PR open/update if this guard were absent.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # need the parent commit(s) to count them; default depth 1 is insufficient
      - name: Check if PR merge commit
        id: check
        run: |
          parents=$(git log -1 --format="%P" | wc -w | tr -d ' ')
          echo "should_publish=$([ "$parents" -gt 1 ] && echo true || echo false)" >> $GITHUB_OUTPUT

  publish:
    needs: [build, gate-publish]
    runs-on: ubuntu-latest
    # gate-publish is skipped on non-push events, which also skips this job automatically.
    if: needs.gate-publish.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Download pre-built JAR
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: build/libs/

      - name: Publish JAR to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: |
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local Docker daemon only — do not push yet.
      # The image must be local for Trivy to scan it without registry auth.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/bohemian/vanilla:${{ steps.meta.outputs.version }}
            ghcr.io/bohemian/vanilla:sha-${{ steps.meta.outputs.sha }}
            ghcr.io/bohemian/vanilla:latest

      # Scan always passes — vulnerabilities are surfaced as a warning annotation
      # and visible in the job log, but do not block the publish.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/bohemian/vanilla:latest
          format: json
          output: trivy-results.json
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Warn on vulnerabilities
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::Trivy found $COUNT CRITICAL/HIGH CVE(s) in the container image — review trivy-results.json"
          else
            echo "Container scan clean."
          fi

      # Only reached if the Trivy scan above passes.
      - name: Push Docker image
        run: |
          docker push ghcr.io/bohemian/vanilla:${{ steps.meta.outputs.version }}
          docker push ghcr.io/bohemian/vanilla:sha-${{ steps.meta.outputs.sha }}
          docker push ghcr.io/bohemian/vanilla:latest
