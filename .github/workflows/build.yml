name: Java Build Pipeline

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 3am UTC — triggers dependency-audit

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'  # schedule only triggers dependency-audit

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # head_ref is set on pull_request events (branch name); ref_name on push events.
          # Without this, a push-triggered run checks out a detached HEAD and can't push
          # the Spotless formatting commit back to the branch.
          ref: ${{ github.head_ref || github.ref_name }}

      # Spotless (google-java-format) requires Java 21+. We run it first on 21,
      # then switch to 25 for the actual build and tests.
      - name: Set up Java 21 (for Spotless)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Apply formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase before committing to avoid conflicts if the branch moved
          # between the checkout and this step (e.g. concurrent pushes).
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          ./gradlew spotlessApply
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: apply Spotless formatting"
            git push
          fi

      - name: Set up Java 25 (for build and test)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Static analysis runs before tests: SpotBugs/PMD operate on compiled bytecode and
      # complete in seconds, giving fast feedback on potential bugs before the slower test suite.
      # Find-Sec-Bugs runs as a SpotBugs plugin — no separate step needed.
      - name: Static analysis (SpotBugs + Find-Sec-Bugs + PMD)
        run: ./gradlew spotbugsMain pmdMain

      - name: Test
        run: ./gradlew test

      - name: Coverage gate
        run: ./gradlew jacocoTestCoverageVerification

      # Runs after coverage so a contract failure does not block the coverage gate.
      # Spring Cloud Contract 4.x is incompatible with Spring Framework 7 (Spring Boot 4.x):
      # all three test modes (MOCKMVC/EXPLICIT/WEBTESTCLIENT) hit different API breaks in SFW7.
      # The contracts and stub JARs are generated and published correctly; only contractTest fails.
      # Remove continue-on-error when Spring Cloud Contract 5.x ships for the 2025.0.x train.
      - name: Contract tests
        run: ./gradlew contractTest
        continue-on-error: true

      # Tick off checklist items whose corresponding CI steps have passed.
      # Only runs on PRs; skipped on direct pushes.
      - name: Check off passed checklist items
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, json, re
          pr = '${{ github.event.pull_request.number }}'
          body = json.loads(subprocess.check_output(['gh', 'pr', 'view', pr, '--json', 'body']))['body'] or ''
          # Both static analysis and tests passed to reach this step
          body = re.sub(r'- \[ \] (No new SpotBugs)', r'- [x] \1', body)
          body = re.sub(r'- \[ \] (Tests pass)',       r'- [x] \1', body)
          subprocess.run(['gh', 'pr', 'edit', pr, '--body', body], check=True)
          PYEOF

      - name: Build
        run: ./gradlew assemble

      - name: Generate OpenAPI spec
        run: ./gradlew generateOpenApiDocs

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v5
        with:
          name: openapi-spec
          path: build/docs/openapi/openapi.json
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 14

      - name: Upload analysis reports
        if: always()  # upload even when tests or analysis steps fail, so reports are inspectable
        uses: actions/upload-artifact@v5
        with:
          name: analysis-reports
          path: |
            build/reports/spotbugs/
            build/reports/pmd/
            build/reports/jacoco/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml

  blackbox-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Download pre-built JAR
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: build/libs/

      - name: Build Docker image
        run: docker build -t vanilla:blackbox .

      - name: Start services
        run: VANILLA_IMAGE=vanilla:blackbox docker compose up --no-build --wait --wait-timeout 210

      - name: Run black-box tests
        run: ./gradlew blackboxTest

      - name: Upload black-box test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blackbox-reports
          path: build/reports/tests/blackboxTest/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down

  migration-forward-compat:
    # Verifies that the main branch code (current production) can run against the new schema
    # produced by this PR's migrations.  This covers the rolling-update window where old pods
    # are serving traffic after the migrate Job has committed the new schema.
    # Runs scripts/check-migration-compat.sh — the same script developers run locally.
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for new migrations
        id: check
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          NEW=$(git diff origin/${{ github.base_ref }}..HEAD \
            --name-only --diff-filter=A -- 'src/main/resources/db/migration/*.sql')
          if [ -n "$NEW" ]; then
            echo "New migration files:"
            echo "$NEW"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No new migrations in this PR — skipping"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 25
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.check.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        if: steps.check.outputs.found == 'true'
        run: chmod +x gradlew

      - name: Download pre-built PR JAR
        if: steps.check.outputs.found == 'true'
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: build/libs/

      - name: Run migration forward-compat check
        if: steps.check.outputs.found == 'true'
        run: scripts/check-migration-compat.sh

      - name: Tick checklist item on success
        if: steps.check.outputs.found == 'true'
        run: |
          python3 - <<'PYEOF'
          import subprocess, json, re
          pr = '${{ github.event.pull_request.number }}'
          body = json.loads(subprocess.check_output(['gh', 'pr', 'view', pr, '--json', 'body']))['body'] or ''
          body = re.sub(r'- \[ \] (New migrations are additive-only)', r'- [x] \1', body)
          subprocess.run(['gh', 'pr', 'edit', pr, '--body', body], check=True)
          PYEOF

  describe-pr:
    runs-on: ubuntu-latest
    # Only on first open — not on every subsequent push to the branch.
    # Skips the bot to avoid rewriting a description the bot itself just set.
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history needed for git diff origin/<base>...HEAD
      - name: Load prompt
        id: prompt
        run: |
          PROMPT=$(awk 'BEGIN{n=0} /^---/{n++; next} n>=2{print}' .claude/agents/pr-description/pr-description.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Generate PR description
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Bash(git:*,gh:*)"'
          prompt: ${{ steps.prompt.outputs.content }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

  pr-review:
    runs-on: ubuntu-latest
    # Exclude github-actions[bot] to prevent an infinite loop: the bot's own Spotless
    # formatting commit would otherwise re-trigger another review.
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
      - name: Load review prompt
        id: prompt
        run: |
          PROMPT=$(awk 'BEGIN{n=0} /^---/{n++; next} n>=2{print}' .claude/agents/pr-review/pr-review.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Read,Grep,Glob,Edit,Write,Bash(git:*)"'
          prompt: ${{ steps.prompt.outputs.content }}

  dependency-audit:
    runs-on: ubuntu-latest
    # Run on the weekly schedule, or on any PR labelled "dependencies" for on-demand audits.
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(toJson(github.event.pull_request.labels.*.name), 'dependencies'))
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: OWASP dependency vulnerability scan
        run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: owasp-report
          path: build/reports/dependency-check-report.html
          retention-days: 30

  # Determines whether the push to main was a PR merge (2-parent merge commit)
  # or a direct push (1-parent commit). Only PR merges should trigger publish.
  gate-publish:
    runs-on: ubuntu-latest
    # Must be scoped to push-to-main: on pull_request events GitHub creates a temporary
    # 2-parent merge ref, which would fool the parent-count check and trigger publish
    # on every PR open/update if this guard were absent.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # need the parent commit(s) to count them; default depth 1 is insufficient
      - name: Check if PR merge commit
        id: check
        run: |
          parents=$(git log -1 --format="%P" | wc -w | tr -d ' ')
          echo "should_publish=$([ "$parents" -gt 1 ] && echo true || echo false)" >> $GITHUB_OUTPUT

  publish:
    needs: [build, blackbox-test, gate-publish]
    runs-on: ubuntu-latest
    # gate-publish is skipped on non-push events, which also skips this job automatically.
    if: needs.gate-publish.outputs.should_publish == 'true'
    permissions:
      contents: write  # needed to create GitHub releases
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Download pre-built JAR
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: build/libs/

      - name: Publish service JAR to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and publish client JAR to GitHub Packages
        # Runs the full chain: generateOpenApiDocs (boots app against H2) →
        # openApiGenerate (generates Java source) → clientJar → publish client.
        # The openapi.json produced here is also used by the GitHub release step below.
        run: ./gradlew clientJar publishClientPublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: |
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local Docker daemon only — do not push yet.
      # The image must be local for Trivy to scan it without registry auth.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/bohemian/vanilla:${{ steps.meta.outputs.version }}
            ghcr.io/bohemian/vanilla:sha-${{ steps.meta.outputs.sha }}
            ghcr.io/bohemian/vanilla:latest

      # BB runner image — used by k8s/verify-job.yaml.tpl to run the
      # post-deploy verification suite against each new candidate pod.
      - name: Build BB runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bb
          push: false
          load: true
          tags: |
            ghcr.io/bohemian/vanilla-bb:${{ steps.meta.outputs.version }}
            ghcr.io/bohemian/vanilla-bb:sha-${{ steps.meta.outputs.sha }}
            ghcr.io/bohemian/vanilla-bb:latest

      # Scan always passes — vulnerabilities are surfaced as a warning annotation
      # and visible in the job log, but do not block the publish.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/bohemian/vanilla:latest
          format: json
          output: trivy-results.json
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Warn on vulnerabilities
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::Trivy found $COUNT CRITICAL/HIGH CVE(s) in the container image — review trivy-results.json"
          else
            echo "Container scan clean."
          fi

      # Only reached if the Trivy scan above passes.
      - name: Push app image
        run: |
          docker push ghcr.io/bohemian/vanilla:${{ steps.meta.outputs.version }}
          docker push ghcr.io/bohemian/vanilla:sha-${{ steps.meta.outputs.sha }}
          docker push ghcr.io/bohemian/vanilla:latest

      - name: Push BB runner image
        run: |
          docker push ghcr.io/bohemian/vanilla-bb:${{ steps.meta.outputs.version }}
          docker push ghcr.io/bohemian/vanilla-bb:sha-${{ steps.meta.outputs.sha }}
          docker push ghcr.io/bohemian/vanilla-bb:latest

      - name: Create GitHub release and attach OpenAPI spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}-sha-${{ steps.meta.outputs.sha }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "build/docs/openapi/openapi.json#openapi.json"

  # Smoke-test the published image by spinning it up with Docker Compose and hitting
  # the health endpoint.  Runs only after a successful publish so the image is in GHCR.
  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract published version
        id: meta
        run: |
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start services
        run: |
          VANILLA_IMAGE=ghcr.io/bohemian/vanilla:${{ steps.meta.outputs.version }} \
            docker compose up --no-build --wait --wait-timeout 240

      - name: Smoke test — liveness
        run: curl -sf http://localhost:8080/actuator/health/liveness

      - name: Smoke test — readiness
        run: curl -sf http://localhost:8080/actuator/health/readiness

      - name: Smoke test — OpenAPI docs
        run: curl -sf http://localhost:8080/v3/api-docs

      - name: Tear down
        if: always()
        run: docker compose down
