
name: Java Build Pipeline

on:
  push:
  pull_request:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java 21 (for Spotless)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Apply formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          ./gradlew spotlessApply
          if ! git diff --quiet; then
            git add -A
            git commit -m "Apply Spotless formatting"
            git push
          fi

      - name: Set up Java 25 (for build and test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew assemble

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 14

  pr-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Read,Grep,Glob,Edit,Write,Bash(git:*)"'
          prompt: |
            You are a code reviewer for a Java Spring Boot project. Review the pull request and address issues as follows:

            For each issue found:
            - If it is a clear, self-contained fix (e.g. System.out.println, typo, simple bug): apply the fix directly using Edit or Write, then commit it to the branch with git commit and git push
            - If it requires broader design discussion or the intent is unclear: post an inline comment describing the issue and the recommended approach

            Review for:
            1. Bugs or logic errors — incorrect behaviour, edge cases, null handling
            2. Security issues — injection, auth, sensitive data exposure
            3. Code quality — readability, duplication, naming, complexity
            4. Java/Spring best practices — JPA mappings, transaction boundaries, dependency injection, exception handling

            Be concise. Only raise issues that matter. If the changes look good, say so briefly.

