# Debug overlay for local development. Merged by: make deploy
# Adds JDWP remote debugging on localhost:5005.
# Not used for BDD tests or CI — keeps the base image lean.
services:
  app:
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "5005:5005"
